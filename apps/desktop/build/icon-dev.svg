<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg-grad-dev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1215"/>
      <stop offset="100%" stop-color="#110708"/>
    </linearGradient>
    <linearGradient id="printer-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bg-grad-dev)" stroke="#4c1d24" stroke-width="16"/>

  <!-- Subtle glow beneath printer -->
  <circle cx="512" cy="490" r="260" fill="#e11d48" opacity="0.15" filter="url(#glow-red)"/>

  <!-- Printer Icon (Stroke 52px, Rounded) -->
  <g transform="translate(512, 480) scale(25) translate(-12, -12)" fill="none" stroke="url(#printer-red)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
    <path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/>
    <rect x="6" y="14" width="12" height="8" rx="1"/>
  </g>

  <!-- DEV Pill Badge at bottom -->
  <g transform="translate(512, 820)">
    <rect x="-150" y="-50" width="300" height="100" rx="50" fill="#e11d48" stroke="#fda4af" stroke-width="8"/>
    <text x="0" y="20" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" text-anchor="middle" letter-spacing="6">DEV</text>
  </g>
</svg>