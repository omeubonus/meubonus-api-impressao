name: silentprint

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: silentprint
      POSTGRES_PASSWORD: silentprint
      POSTGRES_DB: silentprint_db
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silentprint -d silentprint_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - silentprint-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-3335}:3333"
    environment:
      NODE_ENV: development
      PORT: 3333
      DATABASE_URL: postgresql://silentprint:silentprint@postgres:5432/silentprint_db?schema=public
      JWT_SECRET: dev-silentprint-super-secret-jwt-token-key-32chars
      ADMIN_EMAIL: admin@silentprint.local
      ADMIN_PASSWORD: Admin@123456
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080,http://localhost:8085,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - silentprint-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3335
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8085}:80"
    depends_on:
      - api
    networks:
      - silentprint-net

networks:
  silentprint-net:
    driver: bridge

volumes:
  pgdata:
