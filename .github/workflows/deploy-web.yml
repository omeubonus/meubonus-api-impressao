name: Build, Push Web (GHCR) & Deploy Coolify

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código-fonte
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados para Docker (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Compilar e publicar imagem Docker do Painel Web (GHCR)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notificar Coolify via Webhook ou API (Web Service)
        env:
          COOLIFY_WEB_WEBHOOK_URL: ${{ secrets.COOLIFY_WEB_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEB_WEBHOOK_URL" ]; then
            echo "ℹ️ COOLIFY_WEB_WEBHOOK_URL não configurada nos secrets. Pulando notificação de deploy no Coolify."
            exit 0
          fi
          echo "🚀 Disparando solicitação de deploy do Painel Web no Coolify..."
          if [ -n "$COOLIFY_API_TOKEN" ]; then
            echo "Enviando requisição autenticada com Bearer Token..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$COOLIFY_WEB_WEBHOOK_URL" -H "Authorization: Bearer $COOLIFY_API_TOKEN")
            BODY=$(echo "$RESPONSE" | sed -e '$d')
            STATUS=$(echo "$RESPONSE" | tail -n1 | sed -e 's/HTTP_STATUS://')
            echo "Resposta Coolify (HTTP $STATUS): $BODY"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "✅ Deploy automático do Painel Web no Coolify enfileirado com sucesso!"
            else
              echo "❌ Falha ao acionar deploy do Painel Web no Coolify (HTTP $STATUS)"
              exit 1
            fi
          else
            echo "Enviando requisição via Webhook direto..."
            curl -f -X POST "$COOLIFY_WEB_WEBHOOK_URL" || curl -f -X GET "$COOLIFY_WEB_WEBHOOK_URL"
            echo "✅ Gatilho de deploy do Painel Web no Coolify concluído com sucesso."
          fi
